<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · SingleCellX</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">SingleCellX</span>
        </div>
        <div class="auth-tagline">SECURE ACCESS · v1.0</div>
      </div>

      <h2 style="font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.02em;">Sign in</h2>
      <p class="text-dim text-sm mb-24">Continue your analysis where you left off.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username or email</label>
          <input class="form-input" id="username" type="text" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" autocomplete="current-password" required>
        </div>

        <div id="error-msg" class="form-error hidden"></div>

        <button class="btn btn-primary" type="submit" id="submit-btn" style="width: 100%;">
          <span id="btn-label">Sign in</span>
          <span id="btn-spin" class="spinner hidden"></span>
        </button>
      </form>

      <div class="auth-switch">
        New here? <a href="/register.html">Create an account</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (Storage.getToken()) window.location.href = '/dashboard.html';

    const form = document.getElementById('login-form');
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');
    const lbl = document.getElementById('btn-label');
    const spn = document.getElementById('btn-spin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      btn.disabled = true; lbl.classList.add('hidden'); spn.classList.remove('hidden');
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const data = await Api.login(username, password);
        Storage.setToken(data.access_token);
        Storage.setUser(data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errEl.textContent = typeof err.detail === 'string' ? err.detail : 'Invalid credentials.';
        errEl.classList.remove('hidden');
        btn.disabled = false; lbl.classList.remove('hidden'); spn.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
